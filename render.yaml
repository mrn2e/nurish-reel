# Render Blueprint — deploys the nurish-reel FastAPI backend.
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New > Blueprint, pick this repo.
#   3. Render reads this file and creates the service below.
#   4. Fill in GEMINI_API_KEY and USDA_API_KEY (marked sync:false) in the UI.
#   5. After the first deploy, copy the service URL (https://<name>.onrender.com)
#      and set it as the frontend's API base (see README "Deploy").
#
# The free plan sleeps after ~15 min idle and cold-starts on the next request —
# expected, and fine for a hackathon demo.
services:
  - type: web
    name: nurish-reel-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # Transcription + recipe structuring both use this one key.
      - key: GEMINI_API_KEY
        sync: false
      # Structuring model (text -> recipe JSON). Floating alias avoids the
      # retired/blocked pinned names that 404.
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Transcription model (audio -> text). Dedicated ASR model with its own
      # quota; blank reuses GEMINI_MODEL.
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.5-transcribe
      # Nutrition lookup (free: https://fdc.nal.usda.gov/api-key-signup.html).
      - key: USDA_API_KEY
        sync: false
      # Allowed browser origin(s) for the deployed frontend, comma-separated.
      # Set this to your Vercel URL, e.g. https://nurish-reel.vercel.app
      # Leave blank to allow all origins (simplest for a demo).
      - key: CORS_ORIGINS
        sync: false
      # Local disk storage + SQLite (ephemeral on free plan; OK for the demo).
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./data/storage
      - key: DATABASE_URL
        value: sqlite:///./data/nurish.sqlite3
